# Golden questions for retrieval and answer evaluation (scripts/evaluate.py).
#
# expected_chunks: chunk_ids that SHOULD come back near the top. A question is a
# hit if ANY of them is in the top k. A trailing * matches a prefix
# (e.g. "api:overview:design-rules:*"). Chunk ids are in data/processed/chunks.jsonl.
# If you change chunking, evaluate.py warns about ids that no longer exist.
#
# category out_of_scope = the docs can't answer it; the bot should say so.
# Questions are worded the way a person would ask, not copied from the docs,
# so keyword search doesn't get a free pass.

