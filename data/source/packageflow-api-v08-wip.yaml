      description: |
        **Who can use this:** Restricted-Item Inspector.

        Only a Restricted-Item Inspector can call this. It is a role of its own, separate from Facilities Lead and the delivery roles, and nobody gets it by holding another role. The inspector checks that a hazardous or controlled package is not damaged or compromised, to keep lab staff and others safe. Restricted packages cannot be delivered
        until inspection and custody requirements are met. Access is audit logged.
        Policy details are still being defined, so this shape is a placeholder.

        The inspector must hold a live authorization for the `category` in the request, not just the inspector role. Otherwise 403 with problem type `/problems/not-authorized-for-category`. Someone without the inspector role, including a Facilities Lead or Delivery Team Member, gets a plain 403.

        The app shows the button only when `allowedActions` on the package includes `inspect`. The result appears in `restricted.inspectionStatus`.
