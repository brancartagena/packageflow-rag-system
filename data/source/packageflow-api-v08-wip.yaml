        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-required-roles:
      - PackageReceiver
      - DeliveryTeamMember
      - FacilitiesLead
      - Requester
      - AuthorizedRestrictedItemInspector
      security:
      - entraId:
        - packageflow.write
      x-screens:
      - 'Delivery: Missing location (Contact requester, Teams or Email)'
      - 'Lead: Resolve exception (Contact requester, Teams or Email)'
      - 'Requester: Track package, Confirm receipt (Contact Facilities, Teams or Email)'
