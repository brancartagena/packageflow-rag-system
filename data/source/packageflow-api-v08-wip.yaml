      - Requester
      security:
      - entraId:
        - packageflow.write
      x-screens:
      - 'Receiver: Receipt photo'
      - 'Delivery: Capture photo, Photo evidence'
  /packages/{packageId}/evidence/{evidenceId}:
    parameters:
    - $ref: '#/components/parameters/PackageId'
    - $ref: '#/components/parameters/EvidenceId'
    delete:
      tags:
      - Photos & Evidence
      summary: Delete a photo that has not been submitted
      description: |
        **Who can use this:** Package Receiver, Delivery Team Member, Restricted-Item Inspector, Requester, Facilities Lead.

        Use when a photo is blurry, shows the wrong package, or captures something it should not.
        The person who took it can delete it, and so can a Facilities Lead.

        **Only works while `submitted` is false.** A photo counts as submitted once a completed action
        references it (a delivery, an acknowledgement, or a dispute). After that, use the void endpoint.

        This is a **soft delete**. The item becomes `lifecycleStatus: Deleted` and disappears from the app immediately. The record of who deleted it, when, and why is kept. If the deleted photo was the only delivery photo, the evidence gate fails again until a new one is uploaded.

        A photo that was never uploaded does not need this call. The app just discards its local file.
      operationId: deleteEvidence
      x-required-roles:
      - PackageReceiver
      - DeliveryTeamMember
      - AuthorizedRestrictedItemInspector
      - Requester
      - FacilitiesLead
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: reason
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/EvidenceRemovalReason'
      - name: note
        in: query
        description: Required when reason is Other.
        schema:
          type: string
          maxLength: 500
      responses:
        '204':
          description: Photo deleted
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Package-ETag:
              $ref: '#/components/headers/PackageETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Photo was already submitted, so it cannot be deleted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.packageflow.example.com/problems/evidence-already-submitted
                title: Evidence already submitted
                status: 409
                detail: This photo is part of a completed delivery. Ask a Facilities Lead to void it and upload
                  a replacement.
                correlationId: 7c2e91b4-3a5d-4e08-b6f1-0d94a8c3e512
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - entraId:
        - packageflow.write
      x-screens:
      - 'Delivery: Photo evidence (Remove photo), Retake photo'
