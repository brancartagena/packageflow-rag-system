  /packages/{packageId}/contact-messages:
    post:
      tags:
      - Packages (Shared)
      summary: Send a Teams message or email about a package
      operationId: sendContactMessage
      description: |
        **Who can use this:** Package Receiver, Delivery Team Member, Restricted-Item Inspector, Facilities Lead, Requester.

        PackageFlow sends the message for you. This is what the Teams and Email options on the "Contact requester" and "Contact Facilities" sheets call. Phone is different, see `logContactAttempt`.

        The server writes the text from `purpose`, adds the package number and your name, and adds your `note` if you send one. It never includes restricted-item details. PackageFlow does not receive replies. A reply goes to the sender in Teams or email, not into the app.

        Staff can contact the requester, the current owner, or Facilities. A requester can only contact `Facilities`, and any other target returns 403. The channel must be open for that person (see `channels` on `GET /packages/{packageId}/contacts`), or you get `422` with problem type `/problems/channel-unavailable`.

        The send counts as a contact attempt, so the "Not contacted" chip clears. The message shows on `GET /packages/{packageId}/notifications` with its retries, and a Lead can resend a failed one. A short cooldown per package, person, and channel stops repeat sends, and returns 429.

        Needs a connection. It is not an offline sync command. Does not change the package version.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/PackageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendContactMessageRequest'
      responses:
        '202':
          description: Message queued
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactAttempt'
