                title: Delivery evidence incomplete
                status: 422
                detail: At least one delivery photo must be uploaded before marking this package delivered.
                correlationId: 0b8f2a4e-6c1d-4f3a-9d77-2a1c5e8b9f10
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - entraId:
        - packageflow.write
      x-screens:
      - 'Delivery: Photo proof (Mark as delivered), Uploading proof'
