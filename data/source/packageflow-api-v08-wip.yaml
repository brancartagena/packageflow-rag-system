openapi: 3.0.3
info:
  title: PackageFlow API
  version: 0.8.0-draft
  description: |
    Draft API for PackageFlow, a mobile app for Facilities package receipt and delivery.
    Built from the BRD (v0.4), the Technical Architecture and Data Model, the Cloud System Architecture, and the process flow.

    ## Who uses it

    | Role | What they do | Where to look |
    |---|---|---|
    | **Package Receiver** | Finds the order from the box, records receipt at the dock | Package Receiver |
    | **Delivery Team Member** | Accepts assigned packages, delivers, takes the photo | Delivery Team, Photos & Evidence |
    | **Facilities Lead** | Assigns work, watches queues, handles exceptions, corrects records | Facilities Lead, Exceptions, Audit |
    | **Requester** | Tracks the package, confirms receipt or reports a problem | Requester |
    | **Restricted-Item Inspector** | Inspects hazardous and controlled items to check they are safe. Does not carry or deliver | Restricted Items |

    The Package Receiver and Delivery Team Member can be the same person, so one user can hold more than one role.
    Requester is implicit: every active person is a requester, so it is never stored as a role grant.
    Restricted-Item Inspector is a role of its own, separate from Facilities Lead and the delivery roles. It is two checks,
    not one: the role, plus a live authorization for the item category
    (controlled substance or hazardous material). `GET /session` reports both.
    A Delivery Team Member also needs a live authorization for the category before they can be assigned or carry a
    restricted package. Inspect and carry are separate authorizations.
    Every endpoint says **Who can use this** at the top of its description.

    ## Signed-in user

    There is no user ID in any URL for "me". The server reads the signed-in person from the Microsoft Entra ID token.
    Role-named paths like `/requester/packages` and `/delivery/my-work` return only the caller's own data.

    ## Package lifecycle

    | State | Meaning | Moves to |
    |---|---|---|
    | `Received` | At the dock, available for routing | Assigned, OnHold, Cancelled |
    | `Assigned` | Owner picked, not yet accepted | Accepted, Received, OnHold, Cancelled |
    | `Accepted` | Owner accepted | InDelivery, Assigned, Received, OnHold, Cancelled |
    | `InDelivery` | Being delivered. Cannot be cancelled; return it to the dock first | AwaitingAcknowledgement, Accepted (reattempt), Assigned, Received, OnHold |
    | `OnHold` | Paused. `heldFromState` says where it resumes | The state it came from, or Cancelled |
    | `AwaitingAcknowledgement` | Delivered with evidence, waiting on the requester | Acknowledged, Closed, Assigned, Received, OnHold |
    | `Acknowledged` | Requester confirmed | Closed |
    | `Closed`, `Cancelled` | Final | None. Mistakes get a correction event |

    An open exception is **not** a state. It is `hasOpenException` plus an exception case, so a package keeps its
    real state and resumes where it left off when the exception is resolved.
    A package with no procurement match stays in `Received` (or `OnHold`) until it is matched.

    ## Design rules

    - Procurement is the source of truth for orders and requesters. PackageFlow never changes procurement-owned fields.
      The one write-back is marking an order delivered after all its packages are delivered. Write-back status is tracked per order.
    - Lifecycle state only changes through action endpoints (receive, assign, accept, deliver, hold, return). No endpoint sets `state` directly.
    - **Idempotency.** Every write needs an `Idempotency-Key` header so offline retries are safe. Exceptions: `PUT` and `DELETE` on
      `/devices/{deviceId}` and `PUT /me/preferences` (naturally idempotent), and `POST /orders/search` (read-only).
      Keys are scoped to the signed-in user and remembered for 72 hours (proposed, confirm).
      Repeating a key with the same body returns the original result with `Idempotency-Replayed: true`.
      Repeating a key with a different body returns `422` with problem type `/problems/idempotency-key-reuse`.
    - **Concurrency.** Package changes use `If-Match` with the package `ETag`. Exceptions have their own `ETag`.
      A response whose body is a Package returns `ETag`. Any other response that changes a package returns `Package-ETag`,
      so the app never has to re-read just to get a fresh version. Evidence changes bump the package version but do not require `If-Match`.
    - Photos upload straight to Azure Blob Storage with a short-lived URL. The API stores metadata only.
      Clients may supply their own `evidenceId`, `packageId`, and `assignmentId` (UUIDs) so work queued offline can refer to records that do not exist yet.
    - **Package numbers.** The PKG number is reserved with `POST /package-numbers` when the receiver confirms an order match, and it is fixed when the package is received.
      Lookup never reserves one. A lapsed reservation never blocks receipt, the server just assigns a new number. Numbers are unique and never reused, so gaps are normal.
    - **Delivery location.** It always comes from the procurement order (`OrderRef.workLocation`). Requesters have no default location of their own.
      If an order has none, staff set one with `POST /packages/{packageId}/delivery-location`, which never changes procurement data.
    - **Contact.** PackageFlow sends Teams and email messages itself. It does not hand out email addresses or Teams links, and it does not receive replies.
      Phone calls are placed from the dialer and logged. Messages need a connection and are not offline sync commands.
    - **Photo checks.** In the pilot the app checks that a photo is clear, on the device, and only advises. The server does not judge photos.
      `review` on a photo is a placeholder for a later server check. It never blocks delivery.
    - **Needs review.** `x-needs-review` marks a placeholder that needs more work before it is final. Its text says what is still open.
      Search the file for it to get the list.
    - **Empty fields.** A field with no value is left out of the response instead of being sent as `null`. A few fields can be `null` on purpose, and their schema says so.
    - A package cannot be Delivered until the evidence and location rules pass.
    - Nothing in the lifecycle is hard deleted. A photo that was never submitted can be deleted (soft delete, the file is no longer visible in the app).
      Submitted evidence is voided, mistakes are corrected with a correction event, and packages or assignments are cancelled. All are audit logged.
    - Errors use RFC 7807 `application/problem+json` with a `correlationId`.
    - Enums can grow. Clients must treat an unknown enum value as "other" and keep working.

    ## Gateway rules (Azure API Management)

    APIM sits in front of the BPA runtime and is expected to:

    - run `validate-jwt` against Entra ID, check the audience, and map the `roles` claim and scopes to the `x-required-roles` and `security` on each operation
    - rate limit per user and per device, returning `429` with `Retry-After`
    - reject request bodies over 1 MB (photos never pass through the API) with `413`
    - redact query strings and the `Authorization` header from logs
    - stamp or forward `x-correlation-id`, which the API echoes as `correlationId` in errors

    ## Scope

    This is the contract for the mobile API only. Photos upload straight to Azure Blob Storage with a short-lived URL, so
    binary files never pass through it. Background work (receipt and delivery notifications, reminders, assignment timeouts,
    upload reconciliation, procurement sync, metrics) is not part of this API.

    ## Screen traceability

    Every operation carries `x-screens`, the prototype screens that call it, and some carry `x-pilot-scope`:
    `defer` means no screen uses it, so it can wait; `needs-screen` means the API is needed but the screen is not designed yet.
    See `packageflow-screen-coverage.md` for the full map.

    ## What changed in 0.6

    Cross-referenced against the prototype (Receiver and Delivery, Facilities Lead, Requester).

    - New: bulk assign, set delivery location, acknowledgement reminder, preferences, contact info and contact log,
      delivery and requester summaries, request reassignment, restricted handoff authorization, metrics report.
    - `PackageSummary` gains `packageNumber` (PKG-10482), `assignmentStatus`, `deliveredAt`, `deliveredBy`, `acknowledgementStatus`.
    - Order search returns a `matchScore`. Receive records `matchScore` and `manualOverride`.
    - Queue and metrics numbers the Lead screens show: unassigned, completed today, pending ack, oldest exception, average time, on-time rate, trend.
    - Tracking view: upcoming timeline steps, up to 3 photos, delivered by, delivery notes, the requester's own report status.
    - Notifications carry retry history. Exceptions carry a reason. Resolve gains `Reattempt`.
    - The delivery person can place a package on hold. Delivery takes up to 3 photos.

    ## What changed in 0.5

    - Auth: operations now declare OAuth scopes. Scopes were defined in 0.4 but never used.
    - Lifecycle: `Exception` is no longer a package state. Added `hold`, `release`, and `return` endpoints.
    - Delivery: `location` is now `locationId`. Corrections are typed per field.
    - Search: `GET /orders/lookup` became `POST /orders/search` so requester names and barcodes stay out of URLs.
    - Offline sync: typed command payloads, more command types, `dependsOn`, and server-side ETag chaining.
    - Evidence: notes are no longer blobs, upload status is split from lifecycle status, clients can supply `evidenceId`.
    - Concurrency: ETag on every package-changing response, own ETag and `If-Match` for exceptions, `If-Match` for acknowledgement and corrections.
    - Reliability: `429`, `Retry-After`, `Idempotency-Replayed`, idempotency-key reuse error.
    - Lists: one `{items, nextCursor}` envelope everywhere, no bare arrays.
    - Devices: `PUT /devices/{deviceId}` replaces `POST /devices`.
    - Schemas: `required` lists, `additionalProperties: false` on requests, length limits, shared enums.
    - People: `CurrentUser` and `PersonSummary` expose restricted authorizations and staff availability.
  contact:
    name: PackageFlow Team
servers:
- url: https://api-dev.packageflow.example.com/v1
  description: Development
- url: https://api-qa.packageflow.example.com/v1
  description: Test / QA
- url: https://api-pilot.packageflow.example.com/v1
  description: Pilot
- url: https://api.packageflow.example.com/v1
  description: Production
security:
- entraId:
  - packageflow.read
tags:
- name: Session & Reference Data
  description: Sign-in info, push device registration, and lookup lists used by every role.
- name: Package Receiver
  description: At the dock. Find the order from what is on the box, record receipt, fix mistakes.
- name: Packages (Shared)
  description: Queues, package detail, and history. What each person sees depends on their role.
- name: Facilities Lead
  description: Assign work, balance workload, hold and release packages, watch the queues, correct records.
- name: Delivery Team
  description: The delivery person. See my work by building, accept, deliver, or return a package to the dock.
- name: Photos & Evidence
  description: Photos and signatures. Upload, delete a bad photo before submitting, or void it after. Text notes
    are not evidence.
- name: Requester
  description: The person who ordered the package. Track it, then confirm or report a problem.
- name: Exceptions
  description: 'Problems that need action: failed delivery, no order match, damage, disputes.'
- name: Restricted Items
  description: Controlled substances and hazardous materials. Policy details are still being defined.
- name: Notifications
  description: In-app notifications and delivery status of email, Teams, and push messages.
- name: Audit
  description: Read-only audit trail.
- name: Offline Sync
  description: Replay actions the app queued while offline.
- name: System
  description: Health check.
paths:
  /session:
    get:
      tags:
      - Session & Reference Data
      summary: Get the signed-in user and their roles
      operationId: getSession
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: |
        **Who can use this:** Any signed-in user.

        Returns the person who is signed in, taken from the Entra ID token. The app calls this right after sign-in to learn the user's roles and buildings, then shows the matching screens (Delivery Team, Facilities Lead, Requester, and so on). A user can hold more than one role.

        Also returns `restrictedAuthorizations`. Someone with no live authorization for a category will be rejected for that category, whether they inspect it or carry it.
      x-required-roles:
      - PackageReceiver
      - DeliveryTeamMember
      - FacilitiesLead
      - Requester
      - AuthorizedRestrictedItemInspector
      security:
      - entraId:
        - packageflow.read
      x-screens:
      - 'All roles: Welcome back'
  /me/preferences:
    get:
      tags:
      - Session & Reference Data
      summary: Get my notification and default-building settings
      operationId: getPreferences
      description: |
        **Who can use this:** Any signed-in user.

        Settings on the receiver, delivery, and requester screens. Staff get `defaultBuildingCode`. Requesters get notification settings only. Delivery locations always come from the procurement order, so there is no requester default location.
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-required-roles:
      - PackageReceiver
      - DeliveryTeamMember
      - FacilitiesLead
      - Requester
      - AuthorizedRestrictedItemInspector
      security:
      - entraId:
        - packageflow.read
      x-screens:
      - 'Receiver, Delivery: Settings'
      - 'Requester: Notifications'
    put:
      tags:
      - Session & Reference Data
      summary: Save my notification and default-building settings
      operationId: updatePreferences
      description: |
        **Who can use this:** Any signed-in user.

        Saves what is sent. Fields you leave out are unchanged. Turning off a channel in `lockedChannels` returns 422. Naturally idempotent, so no `Idempotency-Key`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesUpdate'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-required-roles:
      - PackageReceiver
      - DeliveryTeamMember
      - FacilitiesLead
      - Requester
      - AuthorizedRestrictedItemInspector
      security:
      - entraId:
        - packageflow.write
      x-screens:
      - 'Receiver, Delivery: Settings (Save changes)'
      - 'Requester: Notifications'
  /devices/{deviceId}:
    parameters:
    - name: deviceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    delete:
      tags:
      - Session & Reference Data
      summary: Unregister a device from push notifications
      description: |
        **Who can use this:** Any signed-in user.

        Call on sign-out or when a user gets a new phone. Does not touch any package data. Needs no `Idempotency-Key`.
      operationId: unregisterDevice
      parameters: []
      responses:
        '204':
          description: Device unregistered
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-required-roles:
      - PackageReceiver
      - DeliveryTeamMember
      - FacilitiesLead
      - Requester
      - AuthorizedRestrictedItemInspector
      security:
      - entraId:
        - packageflow.write
      x-screens:
      - 'Receiver, Delivery: Settings (Sign out)'
    put:
      tags:
      - Session & Reference Data
      summary: Register or update a device for push notifications
      operationId: registerDevice
      description: |
        **Who can use this:** Any signed-in user.

        Idempotent upsert. Call after sign-in and whenever the push token changes. If this device was last used by someone else, it moves to the signed-in user. Needs no `Idempotency-Key`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '204':
          description: Device registered
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-required-roles:
      - PackageReceiver
      - DeliveryTeamMember
      - FacilitiesLead
      - Requester
      - AuthorizedRestrictedItemInspector
      security:
      - entraId:
        - packageflow.write
      x-screens:
      - 'All roles: Sign in'
      - Settings
  /locations:
    get:
      tags:
      - Session & Reference Data
      summary: Search delivery locations
      description: |
        **Who can use this:** Package Receiver, Delivery Team Member, Restricted-Item Inspector, Facilities Lead.

        Picker for the delivery screen when the drop-off spot differs from the requester's work location,
        for example a heavy lab instrument going to the lab instead of a desk.
      operationId: listLocations
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
      - name: buildingCode
        in: query
        schema:
          type: string
          maxLength: 32
      - name: locationType
        in: query
        schema:
          type: string
          enum:
          - Office
          - Lab
          - SecureArea
          - Dock
          - Other
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Matching active locations
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Location'
                  nextCursor:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-required-roles:
      - PackageReceiver
      - DeliveryTeamMember
      - AuthorizedRestrictedItemInspector
      - FacilitiesLead
      security:
      - entraId:
        - packageflow.read
      x-screens: []
      x-pilot-scope: needs-screen
  /people:
    get:
      tags:
      - Session & Reference Data
      summary: Find people to assign or hand off to
      description: |
        **Who can use this:** Package Receiver, Delivery Team Member, Facilities Lead.

        Returns Facilities staff only, with their current workload. Requesters cannot call this.
        Requester details come from procurement and the enterprise directory, not from this list.

        Each entry shows the person's roles, buildings, availability, and open assignment count, so the lead can pick someone who is allowed to take the package. Use `restrictedCategory` when assigning a restricted package.
      operationId: listAssignablePeople
      x-required-roles:
      - PackageReceiver
      - DeliveryTeamMember
      - FacilitiesLead
      parameters:
      - name: role
        in: query
        schema:
          type: string
          enum:
          - DeliveryTeamMember
      - name: buildingCode
        in: query
        schema:
          type: string
          maxLength: 32
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: availableOnly
        in: query
        description: Hide staff marked unavailable or at their open-assignment limit.
        schema:
          type: boolean
      - name: restrictedCategory
        in: query
        description: Only people with a live authorization to carry this category.
        schema:
          $ref: '#/components/schemas/RestrictedCategory'
      responses:
        '200':
          description: Assignable staff
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonSummary'
                  nextCursor:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - entraId:
        - packageflow.read
      x-screens:
      - 'Lead: Assign delivery, Reassignment'
      - 'Receiver: Sort by building (Hand off)'
  /orders/{procurementOrderId}:
    get:
      tags:
      - Package Receiver
      summary: Get one procurement order reference
      operationId: getOrder
      parameters:
      - name: procurementOrderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Order reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRef'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-required-roles:
      - PackageReceiver
      - FacilitiesLead
      description: |
        **Who can use this:** Package Receiver, Facilities Lead.

        Get one procurement order reference
      security:
      - entraId:
        - packageflow.read
      x-screens: []
      x-pilot-scope: defer
  /packages:
    get:
      tags:
      - Packages (Shared)
      summary: List packages (Received and Delivered queues)
      description: |
        **Who can use this:** Package Receiver, Delivery Team Member, Restricted-Item Inspector, Facilities Lead.

        Powers the Received and Delivered queue screens. Delivery Team Members see only their own work here (use My Work for the by-building view). Facilities Leads see everything. A Restricted-Item Inspector sees only restricted packages in the categories they are authorized for, so this is their inspection queue (use `restrictedOnly`).
      operationId: listPackages
      parameters:
      - name: state
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PackageState'
        style: form
        explode: false
        description: Filter by lifecycle state. Use `hasOpenException` to find packages with problems; exceptions
          are not a state.
      - name: queue
        in: query
        description: received = Received, Assigned, Accepted, InDelivery, OnHold (still on our side). delivered
          = AwaitingAcknowledgement, Acknowledged, Closed.
        schema:
          type: string
          enum:
          - received
          - delivered
      - name: building
        in: query
        schema:
          type: string
      - name: assignedTo
        in: query
        schema:
          type: string
          format: uuid
      - name: requesterId
        in: query
        schema:
          type: string
          format: uuid
      - name: overdueOnly
        in: query
        schema:
          type: boolean
      - name: restrictedOnly
        in: query
        schema:
          type: boolean
      - name: receivedFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: receivedTo
        in: query
        schema:
          type: string
          format: date-time
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - receivedAt
          - -receivedAt
          - age
          - -age
          - building
          default: -receivedAt
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: hasOpenException
        in: query
        schema:
          type: boolean
      - name: assignment
        in: query
        description: 'Received queue chips: Unassigned and Assigned.'
        schema:
          type: string
          enum:
          - unassigned
          - pending
          - accepted
      - name: agingOnly
        in: query
        description: The Aging chip. Uses the aging threshold from `GET /metrics`.
        schema:
          type: boolean
      - name: acknowledgementStatus
        in: query
        description: 'Delivered queue chips: Waiting, Overdue, Confirmed.'
        schema:
          type: string
          enum:
          - Waiting
          - Confirmed
          - Overdue
          - Disputed
          - Refused
      - name: deliveredFrom
        in: query
        description: The Today chip when set to the start of today.
        schema:
          type: string
          format: date-time
      - name: deliveredTo
        in: query
        schema:
          type: string
          format: date-time
      - name: q
        in: query
        description: Package number, vendor, or requester name.
        schema:
          type: string
          minLength: 2
          maxLength: 100
      responses:
        '200':
          description: Page of packages
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PackageSummary'
                  nextCursor:
                    type: string
                    nullable: true
                  totalCount:
                    type: integer
                    description: Matches for the whole filter, not just this page. "Showing 2 of 12".
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-required-roles:
      - PackageReceiver
      - DeliveryTeamMember
      - AuthorizedRestrictedItemInspector
      - FacilitiesLead
      security:
      - entraId:
        - packageflow.read
      x-screens:
      - 'Receiver: Sort by building'
      - 'Lead: Package operations, Received queue, Delivered queue'
    post:
      tags:
      - Package Receiver
      summary: Record dock receipt
      description: |
        **Who can use this:** Package Receiver, Facilities Lead.

        Matches a physical package to a procurement order and creates the package record in state `Received`.
        Use `packageSequence` and `packageCount` when one order arrives as multiple boxes or in parts.
        Triggers the receipt notification job for the requester.

        Send the `packageNumber` you reserved, if you have one. The `packageNumber` in the response is always the final one, so show that.
      operationId: receivePackage
      x-required-roles:
      - PackageReceiver
      - FacilitiesLead
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceivePackageRequest'
      responses:
        '201':
          description: Package received
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
