  /audit/events:
    get:
      summary: Search the audit trail
      description: |
        **Who can use this:** Facilities Lead.

        Read-only. Covers sensitive actions and also who viewed restricted records and evidence.
        Looking at the audit trail is itself logged.

        Entries with `sensitivity: Restricted` are only returned when the token also carries the `packageflow.restricted` scope.
      operationId: listAuditEvents
      parameters:
      - name: entityType
        in: query
        schema:
          type: string
          enum:
          - Package
          - Evidence
          - Assignment
          - Exception
          - Acknowledgement
          - Notification
          - Person
      - name: entityId
        in: query
        schema:
          type: string
          format: uuid
      - name: actorId
        in: query
        schema:
          type: string
          format: uuid
      - name: action
        in: query
        schema:
          type: string
      - name: restrictedOnly
        in: query
        schema:
          type: boolean
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  nextCursor:
                    type: string
                    nullable: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
      tags:
      - Audit
      x-required-roles:
      - FacilitiesLead
      security:
      - entraId:
        - packageflow.read
        - packageflow.admin
      x-screens: []
      x-pilot-scope: defer
  /sync/commands:
    post:
      tags:
      - Offline Sync
      summary: Submit queued offline commands in one batch
      description: |
        **Who can use this:** Any signed-in user. Each command is still checked against the caller's role.

        The app queues permitted actions while offline and replays them here. Each command has its own idempotency key and its payload is the same body the matching endpoint takes.

        **Ordering.** Commands are processed in array order. Each one is judged on its own, so one conflict does not block unrelated packages. To say "only do this if that worked", list the earlier command's key in `dependsOn`. A command whose dependency did not succeed is `Skipped`.

        **ETags.** `ifMatch` is checked for the first command on a package in the batch. After that the server chains: it applies the next command against the version the earlier one produced. This is what lets a device queue Accept, Start, and Deliver offline without every command going stale. Each result returns the new `etag`.

        **Offline photos.** Queue `CreateEvidence` with a client-made `evidenceId`. The result returns the `uploadSlot`. Upload the file, then send `CompleteEvidence`. A queued `DeliverPackage` can name that `evidenceId` in `evidenceIds` and will only apply once the upload is complete.

        Lifecycle and custody conflicts are rejected, not merged.
      operationId: syncCommands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Per-command results, in the same order as the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-required-roles:
      - PackageReceiver
      - DeliveryTeamMember
      - FacilitiesLead
      - Requester
      - AuthorizedRestrictedItemInspector
      security:
      - entraId:
        - packageflow.write
      x-screens:
      - 'Delivery: Uploading proof (Continue in background), Upload failed (Save and exit)'
  /health:
    get:
      tags:
      - System
      summary: Liveness check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 0.5.0-draft
      description: |
        **Who can use this:** Anyone. No sign-in needed.

        Liveness check
      x-screens: []
  /package-numbers:
    post:
      tags:
      - Package Receiver
      summary: Reserve a package number
      description: |
        **Who can use this:** Package Receiver, Facilities Lead.

        Call this when the receiver confirms an order match on Order lookup, so the PKG number can show on the receipt photo and Confirm dock receipt screens. Lookup itself never reserves a number.

        The number is held for the caller until `expiresAt`. Send it as `packageNumber` on `POST /packages`. Repeating the call with the same `Idempotency-Key` returns the same number. A new key gets a new number. Numbers that are never used are not handed out again, so gaps are normal.

        Needs a connection. Offline, skip this call and the number is assigned when the receipt syncs.
      operationId: reservePackageNumber
      x-required-roles:
      - PackageReceiver
      - FacilitiesLead
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservePackageNumberRequest'
      responses:
        '201':
          description: Number reserved
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservedPackageNumber'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - entraId:
        - packageflow.write
      x-screens:
      - 'Receiver: Order lookup (Confirm match)'
  /orders/search:
    post:
      tags:
      - Package Receiver
      summary: Search orders from what is on the box
      operationId: lookupOrders
      description: |
        **Who can use this:** Package Receiver, Facilities Lead.

        Package Receivers often do not have an order ID. Search by vendor, catalogue number, requester, or a scanned barcode value. At least one search field is required. Results come from the synced procurement reference, not a live procurement call; check `sourceUpdatedAt` on each result.

        This is a `POST` only because requester names and barcodes must not appear in URLs, proxy logs, or APIM traces. It changes nothing, so it needs no `Idempotency-Key`.

        Results are ordered by `matchScore`, highest first.

        Lookup does not reserve a package number. Call `POST /package-numbers` when the receiver confirms a match.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderSearchRequest'
      responses:
        '200':
          description: Matching orders
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderMatch'
                  nextCursor:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ProcurementUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-required-roles:
      - PackageReceiver
      - FacilitiesLead
      security:
      - entraId:
        - packageflow.read
      x-screens:
      - 'Receiver: Find order, Order lookup'
components:
  securitySchemes:
    entraId:
      type: oauth2
      description: Microsoft Entra ID. Roles come from app role or group claims in the token.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token
          scopes:
            packageflow.read: Read packages, queues, and history
            packageflow.write: Create and update packages and related records
            packageflow.restricted: Restricted-item workflows, restricted evidence, and restricted audit entries
            packageflow.admin: Reporting, audit, corrections, and exception management
  parameters:
    PackageId:
      name: packageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Client-generated UUID, scoped to the signed-in user and kept for 72 hours. Repeating a request
        with the same key and body returns the original result and sets `Idempotency-Replayed: true`. The same key
        with a different body returns 422.'
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Package ETag from the last read or from the most recent `ETag` or `Package-ETag` response header.
        Prevents conflicting handoffs and state changes. A stale value returns 412.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    ExceptionIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exception ETag from `GET /exceptions/{exceptionId}` or the last response for that exception.
        A stale value returns 412.
      schema:
        type: string
  headers:
    ETag:
      description: Version of the package in the body. Send back as If-Match on the next change.
      schema:
        type: string
    PackageETag:
      description: New version of the package this action changed, for responses whose body is not a Package. Use
        it as If-Match next time.
      schema:
        type: string
    ExceptionETag:
      description: Version of the exception in the body. Send back as If-Match when resolving or escalating.
      schema:
        type: string
    IdempotencyReplayed:
      description: '`true` when this is the stored result of an earlier request with the same Idempotency-Key.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role does not allow this action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Action not allowed in the current state, or conflicts with another change
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match did not match. Re-read the package and try again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request is well formed but fails business validation. Also returned when an Idempotency-Key is
        reused with a different body (problem type `/problems/idempotency-key-reuse`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProcurementUnavailable:
      description: Procurement sync is unavailable and no cached match exists
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit hit. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string
          format: uuid
          description: Include this when reporting a problem. It ties the request to logs and workflow runs.
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      description: 'RFC 7807 problem. Known `type` values: `/problems/stale-etag`, `/problems/invalid-transition`,
        `/problems/evidence-gate`, `/problems/idempotency-key-reuse`, `/problems/not-authorized-for-category`, `/problems/procurement-unavailable`, `/problems/assignee-not-eligible`, `/problems/channel-unavailable`.'
    PackageState:
      type: string
      enum:
      - Received
      - Assigned
      - Accepted
      - InDelivery
      - AwaitingAcknowledgement
      - Acknowledged
      - OnHold
      - Cancelled
      - Closed
      description: Lifecycle state. Exceptions are a flag on the package, not a state. See the lifecycle table in
        the API description.
    Role:
      type: string
      enum:
      - PackageReceiver
      - DeliveryTeamMember
      - FacilitiesLead
      - Requester
      - AuthorizedRestrictedItemInspector
      description: Roles from the BRD. Package Receiver and Delivery Team Member can be the same person, so one
        user may hold several roles. Holding Package Receiver alone does not let someone accept or deliver a package.
        That needs the Delivery Team Member role too. Restricted-Item Inspector is a role of its own and is not
        combined with Facilities Lead or the delivery roles.
    PackageType:
      type: string
      description: Final list comes from procurement.
      enum:
      - Standard
      - LabInstrument
      - Supplies
      - Chemical
      - ControlledSubstance
      - HazardousMaterial
      - Other
    CurrentUser:
      type: object
      required:
      - personId
      - displayName
      - roles
      properties:
        personId:
          type: string
          format: uuid
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: Includes `Requester` for every active person. Other roles come from Entra groups or manual
            grants and can expire.
        buildings:
          type: array
          items:
            type: string
        restrictedAuthorizations:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedAuthorization'
          description: Empty unless the user holds a live authorization to inspect or carry a restricted category.
        defaultBuildingCode:
          type: string
          nullable: true
          description: Staff default building from preferences.
    DeviceRegistration:
      type: object
      required:
      - platform
      - pushToken
      additionalProperties: false
      description: Body for `PUT /devices/{deviceId}`. Registering a deviceId that already exists moves it to the
        signed-in user and replaces the token.
      properties:
        platform:
          type: string
          enum:
          - ios
          - android
        pushToken:
          type: string
          maxLength: 1024
        appVersion:
          type: string
          maxLength: 32
    Location:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
        buildingCode:
          type: string
          example: B12
        floor:
          type: string
          example: '3'
        roomCode:
          type: string
          example: 3140
        locationType:
          type: string
          enum:
          - Office
          - Lab
          - SecureArea
          - Dock
          - Other
        description:
          type: string
          description: Free text such as "left of the fume hood".
          maxLength: 2000
      required:
      - locationId
      - buildingCode
    PersonRef:
      type: object
      properties:
        personId:
          type: string
          format: uuid
        displayName:
          type: string
      required:
      - personId
      - displayName
    PersonSummary:
      type: object
      properties:
        personId:
          type: string
          format: uuid
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        buildings:
          type: array
          items:
            type: string
        openAssignments:
          type: integer
          description: Current workload, so leads can balance work.
        isAvailable:
          type: boolean
          description: False when the staff member is marked unavailable.
        maxOpenAssignments:
          type: integer
          minimum: 1
        restrictedAuthorizations:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedAuthorization'
      required:
      - personId
      - displayName
      - roles
    OrderRef:
      type: object
      description: Read-only copy of procurement data. Do not edit.
      required:
      - procurementOrderId
      properties:
        procurementOrderId:
          type: string
          maxLength: 64
        vendorId:
          type: string
          maxLength: 64
        vendorName:
          type: string
          maxLength: 200
        catalogueId:
          type: string
          maxLength: 64
        catalogueNumber:
          type: string
          maxLength: 100
        requester:
          $ref: '#/components/schemas/PersonRef'
        packageType:
          $ref: '#/components/schemas/PackageType'
        workLocation:
          $ref: '#/components/schemas/Location'
        deliveryInstructions:
          type: string
        expectedPackageCount:
          type: integer
        sourceUpdatedAt:
          type: string
          format: date-time
        sourceVersion:
          type: string
          maxLength: 128
    ReservePackageNumberRequest:
      type: object
      additionalProperties: false
      properties:
        procurementOrderId:
          type: string
          maxLength: 64
          description: Optional. The order the receiver confirmed. Recorded for audit, so gaps in numbers can be explained.
    ReservedPackageNumber:
      type: object
      required:
      - packageNumber
      - expiresAt
      properties:
        packageNumber:
          type: string
          pattern: ^PKG-[0-9]+$
          example: PKG-10482
        expiresAt:
          type: string
          format: date-time
          description: When the hold ends. The server sets it. After this, receipt still works but may get a different number.
    ReceivePackageRequest:
      type: object
      description: |
        Send `procurementOrderId` when the package matches an order.
        If nothing matches, send `unmatchedDetails` instead. The package is still recorded as received,
        and an exception "No procurement match" opens so it is not lost (see the process flow).
      anyOf:
      - required:
        - procurementOrderId
      - required:
        - unmatchedDetails
      properties:
        packageId:
          type: string
          format: uuid
          description: Optional. Offline clients supply it so later queued commands can refer to this package.
        packageNumber:
          type: string
          pattern: ^PKG-[0-9]+$
          description: Optional. The number from `POST /package-numbers`. If it has expired, was already used, or was reserved by someone else, receipt still succeeds and the server assigns a new number. Offline clients leave it out and get a number when the command syncs.
        procurementOrderId:
          type: string
          maxLength: 64
        unmatchedDetails:
          type: object
          description: What is written on the package, for when there is no match yet.
          properties:
            vendorName:
              type: string
              maxLength: 200
            catalogueNumber:
              type: string
              maxLength: 100
            labelText:
              type: string
              description: Recipient or other text on the shipping label.
              maxLength: 500
            description:
              type: string
              maxLength: 2000
        packageSequence:
          type: integer
          minimum: 1
          default: 1
        packageCount:
          type: integer
          minimum: 1
          default: 1
        receivedAt:
          type: string
          format: date-time
          description: Defaults to server time. Offline clients should send the capture time.
        dockNotes:
          type: string
          maxLength: 1000
        flagRestricted:
          type: boolean
          description: Receiver can flag a package as restricted even if procurement did not.
        matchScore:
          type: integer
          minimum: 0
          maximum: 100
          description: The score of the match the receiver confirmed. Recorded so a low-confidence match can be
            reviewed later.
        manualOverride:
          type: boolean
          default: false
          description: True when the receiver entered an order by hand instead of confirming a suggested match ("Manual
            override").
      additionalProperties: false
    PackageSummary:
      type: object
      required:
      - packageId
      - packageNumber
      - state
      properties:
        packageId:
          type: string
          format: uuid
        packageNumber:
          type: string
          pattern: ^PKG-[0-9]+$
          example: PKG-10482
          description: What people see and say out loud. Unique and never reused, but gaps are possible. Reserved with `POST /package-numbers` when the receiver confirms a match, and fixed when the package is received. Offline receipts get theirs when they sync.
        procurementOrderId:
          type: string
          maxLength: 64
        packageSequence:
          type: integer
        packageCount:
          type: integer
        state:
          $ref: '#/components/schemas/PackageState'
        packageType:
          $ref: '#/components/schemas/PackageType'
        isRestricted:
          type: boolean
        requester:
          $ref: '#/components/schemas/PersonRef'
        location:
          $ref: '#/components/schemas/Location'
        currentOwner:
          $ref: '#/components/schemas/PersonRef'
        receivedAt:
          type: string
          format: date-time
        ageMinutes:
          type: integer
        hasOpenException:
          type: boolean
        assignmentStatus:
          type: string
          enum:
          - Unassigned
          - Pending
          - Accepted
          description: Drives the Unassigned and Assigned chips in the received queue. Pending means picked but
            not yet accepted.
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        deliveredBy:
          allOf:
          - $ref: '#/components/schemas/PersonRef'
        acknowledgementStatus:
          type: string
          nullable: true
          enum:
          - Waiting
          - Confirmed
          - Overdue
          - Disputed
          - Refused
          - null
          description: Null until delivered. Drives the Waiting, Overdue, and Confirmed chips in the delivered queue.
    Package:
      allOf:
      - $ref: '#/components/schemas/PackageSummary'
      - type: object
        properties:
          order:
            $ref: '#/components/schemas/OrderRef'
          deliveryInstructions:
            type: string
          dockNotes:
            type: string
            maxLength: 1000
          activeAssignment:
            $ref: '#/components/schemas/Assignment'
          deliveredAt:
            type: string
            format: date-time
            nullable: true
          closedAt:
            type: string
            format: date-time
            nullable: true
          evidenceGate:
            $ref: '#/components/schemas/EvidenceGate'
          procurementSync:
            $ref: '#/components/schemas/ProcurementSync'
            description: Write-back status for this package's ORDER. Shared by every package on the order.
          allowedActions:
            type: array
            description: What the current user can do next. Lets the app hide buttons that would fail. `inspect` appears
              only for a Restricted-Item Inspector with a live authorization for this package's category. A Lead or Delivery Team Member never sees it.
            items:
              type: string
              enum:
              - assign
              - accept
              - decline
              - startDelivery
              - addEvidence
              - deliver
              - acknowledge
              - openException
              - resolveException
              - inspect
              - hold
              - release
              - return
              - correct
              - setLocation
              - requestReassignment
              - contactRequester
              - sendReminder
          heldFromState:
            allOf:
            - $ref: '#/components/schemas/PackageState'
            description: Where the package resumes when released. Set only while OnHold.
          holdReason:
            type: string
            nullable: true
          restrictedCategory:
            allOf:
            - $ref: '#/components/schemas/RestrictedCategory'
          restricted:
            $ref: '#/components/schemas/RestrictedStatus'
          ackDueAt:
            type: string
            format: date-time
            nullable: true
            description: When the requester acknowledgement becomes overdue.
          requesterContact:
            type: object
            description: Whether Facilities has tried to reach the requester about this package.
            properties:
              status:
                type: string
                enum:
                - NotContacted
                - Contacted
              lastContactedAt:
                type: string
                format: date-time
                nullable: true
              channel:
                type: string
                enum:
                - Teams
                - Email
                - Phone
                - null
                nullable: true
        required:
        - allowedActions
        - evidenceGate
    ProcurementSync:
      type: object
      description: |
        Write-back status. When all packages for an order are Delivered, PackageFlow marks the order
        delivered in procurement. Partial receipts do not trigger it early.
      properties:
        status:
          type: string
          enum:
          - NotRequired
          - Waiting
          - Pending
          - Synced
          - Failed
          description: Waiting means other packages on the same order are not delivered yet.
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        syncedAt:
          type: string
          format: date-time
          nullable: true
        attemptCount:
          type: integer
        lastError:
          type: string
          nullable: true
      required:
      - status
    TrackingView:
      type: object
      required:
      - packageId
      - currentStep
      - statusText
      - timeline
      properties:
        packageId:
          type: string
          format: uuid
        procurementOrderId:
          type: string
          maxLength: 64
        packageSequence:
          type: integer
        packageCount:
          type: integer
        currentStep:
          type: string
          enum:
          - ReceivedAtDock
          - AssignedForDelivery
          - OutForDelivery
          - Delivered
          - Acknowledged
          - NeedsAttention
          description: '`NeedsAttention` when the package is OnHold or has an open exception.'
        statusText:
          type: string
          description: Plain-language status for display, so the app never relies on color alone.
          example: Out for delivery with Sam. Heading to Building 12.
        currentOwner:
          $ref: '#/components/schemas/PersonRef'
        lastKnownLocation:
          allOf:
          - $ref: '#/components/schemas/Location'
          description: |
            Dock, a building the delivery person is heading to, or the final drop-off spot.
            This is a recorded handling location, not live GPS.
        deliveredLocation:
          allOf:
          - $ref: '#/components/schemas/Location'
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        awaitingMyResponse:
          type: boolean
        timeline:
          type: array
          items:
            type: object
            required:
            - step
            - state
            properties:
              step:
                type: string
                example: Received at dock
              occurredAt:
                type: string
                format: date-time
                nullable: true
              location:
                $ref: '#/components/schemas/Location'
              handledBy:
                $ref: '#/components/schemas/PersonRef'
              state:
                type: string
                enum:
                - Done
                - Current
                - Upcoming
                description: The track screen shows steps that have not happened yet, so Upcoming steps have no
                  `occurredAt`.
        packageNumber:
          type: string
          pattern: ^PKG-[0-9]+$
        deliveryPhotos:
          type: array
          maxItems: 3
          description: Time-limited URLs. Only returned after delivery. The delivery details screen shows a photo
            count.
          items:
            type: object
            required:
            - evidenceId
            - url
            - expiresAt
            properties:
              evidenceId:
                type: string
                format: uuid
              url:
                type: string
                format: uri
              expiresAt:
                type: string
                format: date-time
              capturedAt:
                type: string
                format: date-time
        deliveredBy:
          allOf:
          - $ref: '#/components/schemas/PersonRef'
        deliveryNotes:
          type: string
          nullable: true
          description: What the delivery person wrote, for example "Left with lab coordinator".
        openIssue:
          type: object
          nullable: true
          description: The requester's own report, so "Reported issues, 1 under review" has something to show. Internal
            exception details are never included.
          properties:
            status:
              type: string
              enum:
              - UnderReview
              - Resolved
            reportedAt:
              type: string
              format: date-time
            responseType:
              type: string
              enum:
              - Disputed
              - Refused
            disputeReason:
              type: string
              nullable: true
    EvidenceGate:
      type: object
      description: Tells the app what is still missing before Delivered is allowed.
      properties:
        passed:
          type: boolean
        missing:
          type: array
          items:
            type: string
            enum:
            - deliveryPhoto
            - deliveryLocation
            - inspectionEvidence
            - uploadsPending
      required:
      - passed
      - missing
    AssignRequest:
      type: object
      required:
      - assignedTo
      properties:
        assignedTo:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
        isHandoff:
          type: boolean
          default: false
          description: True when the current owner is passing it on, false for a lead assignment.
        assignmentId:
          type: string
          format: uuid
          description: Optional. Offline clients supply it so a queued `AcceptAssignment` can refer to this assignment
            before the server has seen it. Reusing an ID with an identical request returns the same assignment. An ID that
            already belongs to a different assignment returns `409`.
        assignedToRole:
          type: string
          enum:
          - DeliveryTeamMember
          description: The role the assignee acts under. Only DeliveryTeamMember today. A Restricted-Item Inspector
            cannot be assigned a package, because inspectors inspect and never carry. A restricted package goes to a
            Delivery Team Member who holds a live authorization to carry its category.
      additionalProperties: false
    Assignment:
      type: object
      properties:
        assignmentId:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        assignedTo:
          $ref: '#/components/schemas/PersonRef'
        assignedBy:
          $ref: '#/components/schemas/PersonRef'
        status:
          type: string
          enum:
          - Pending
          - Accepted
          - Declined
          - Reassigned
          - Expired
          - Completed
        assignedAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
        assignedToRole:
          type: string
          enum:
          - DeliveryTeamMember
        isHandoff:
          type: boolean
      required:
      - assignmentId
      - packageId
      - assignedTo
      - status
      - assignedAt
    CreateEvidenceRequest:
      type: object
      required:
      - evidenceType
      - contentType
      - sizeBytes
      - capturedAt
      properties:
        evidenceType:
          $ref: '#/components/schemas/EvidenceType'
        contentType:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/heic
        sizeBytes:
          type: integer
          maximum: 10485760
          minimum: 1
        capturedAt:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 2000
        latitude:
          type: number
          format: double
          description: Optional GPS at capture.
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        replacesEvidenceId:
          type: string
          format: uuid
          description: Set when this upload replaces a voided or deleted photo.
        evidenceId:
          type: string
          format: uuid
          description: Optional. Offline clients supply it so a queued delivery can reference the photo before it
            is uploaded. Reusing an existing ID with an identical request returns the same upload slot.
      additionalProperties: false
    EvidenceUploadSlot:
      type: object
      required:
      - evidenceId
      - uploadUrl
      - expiresAt
      properties:
        evidenceId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: Short-lived Blob Storage URL. Upload with HTTP PUT.
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
          example:
            x-ms-blob-type: BlockBlob
        expiresAt:
          type: string
          format: date-time
    EvidenceReview:
      type: object
      x-needs-review: 'Draft. Open: what is checked, whether a vision model is used at all, who sees the result, and what a Lead does with a flagged photo.'
      description: Result of an automatic check on the uploaded photo. Staff only. Advisory, it never blocks delivery. Left out until a check has run. In the pilot nothing sets it, because the app checks clarity on the device.
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - Pending
          - Passed
          - NeedsReview
        reasons:
          type: array
          items:
            type: string
            enum:
            - Blurry
            - TooDark
            - NoPackageSeen
            - Other
        checkedAt:
          type: string
          format: date-time
    EvidenceItem:
      type: object
      properties:
        evidenceId:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        evidenceType:
          $ref: '#/components/schemas/EvidenceType'
        uploadStatus:
          type: string
          enum:
          - Pending
          - Uploaded
          - Failed
          description: Transfer state only. Whether the item was deleted or voided is `lifecycleStatus`.
        lifecycleStatus:
          type: string
          enum:
          - Active
          - Deleted
          - Voided
          description: 'Deleted: removed before it was ever submitted. Voided: was submitted, now struck from the
            record.'
        submitted:
          type: boolean
          description: True once a completed delivery, acknowledgement, or dispute references this item. Submitted
            items cannot be deleted, only voided.
        replacesEvidenceId:
          type: string
          format: uuid
          nullable: true
        capturedAt:
          type: string
          format: date-time
        uploadedBy:
          $ref: '#/components/schemas/PersonRef'
        checksum:
          type: string
          maxLength: 128
        retentionClass:
          type: string
          enum:
          - Standard
          - RestrictedItem
          - Signature
          - Audit
        readUrl:
          type: string
          format: uri
          nullable: true
          description: Time-limited read URL. Null unless the caller may view this evidence.
        readUrlExpiresAt:
          type: string
          format: date-time
          nullable: true
        legalHold:
          type: boolean
          description: When true the file is kept, even after delete. Set by a Facilities Lead.
        review:
          $ref: '#/components/schemas/EvidenceReview'
      required:
      - evidenceId
      - packageId
      - evidenceType
      - uploadStatus
      - lifecycleStatus
      - submitted
      - capturedAt
    DeliverRequest:
      type: object
      required:
      - deliveredAt
      - locationId
      properties:
        deliveredAt:
          type: string
          format: date-time
          description: When it was dropped off. Offline clients send the capture time. Rejected if in the future
            or before the package was received.
        locationId:
          type: string
          format: uuid
          description: A location from `GET /locations`. Free-form building or room data is not accepted.
        locationNote:
          type: string
          maxLength: 500
          description: Where exactly, for example "left of the fume hood".
        notes:
          type: string
          maxLength: 2000
        evidenceIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 3
          description: Up to 3 photos. One clear photo is enough.
        exceptionOverride:
          type: object
          description: Only for authorized users when evidence cannot be captured, such as camera permission denied.
          required:
          - reasonCode
          - justification
          properties:
            reasonCode:
              type: string
              enum:
              - CameraDenied
              - DeviceFailure
              - UploadFailed
              - Other
            justification:
              type: string
              maxLength: 1000
      additionalProperties: false
    DisputeReason:
      type: string
      enum:
      - NotReceived
      - WrongLocation
      - Damaged
      - WrongItem
      - Other
      description: One reason per report. The Report a problem screen shows these as single choices. NotReceived is "Package not received".
        WrongLocation is "Wrong location", for a package left somewhere other than where the requester expected. Damaged is "Damaged package".
        WrongItem is "Wrong item". Other should come with a `comment` so Facilities knows what happened.
    AcknowledgementRequest:
      type: object
      required:
      - responseType
      properties:
        responseType:
          type: string
          enum:
          - Acknowledged
          - Disputed
          - Refused
        comment:
          type: string
          maxLength: 1000
        disputeReason:
          allOf:
          - $ref: '#/components/schemas/DisputeReason'
          description: Required when responseType is Disputed. Send one reason only.
        evidenceIds:
          type: array
          description: Optional photos of the problem, uploaded first as `RequesterDisputePhoto`.
          items:
            type: string
            format: uuid
          maxItems: 5
      additionalProperties: false
    Acknowledgement:
      type: object
      properties:
        acknowledgementId:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        responseType:
          type: string
          enum:
          - Acknowledged
          - Disputed
          - Refused
          - Overdue
        respondedBy:
          $ref: '#/components/schemas/PersonRef'
        respondedAt:
          type: string
          format: date-time
        comment:
          type: string
          maxLength: 1000
        disputeReason:
          $ref: '#/components/schemas/DisputeReason'
      required:
      - acknowledgementId
      - packageId
      - responseType
      - respondedBy
      - respondedAt
    ExceptionCategory:
      type: string
      enum:
      - NoProcurementMatch
      - MissingLocation
      - FailedDelivery
      - Damaged
      - UploadFailure
      - NotificationFailure
      - ProcurementSyncFailure
      - EvidenceReplacementNeeded
      - RestrictedHold
      - RequesterDispute
      - RequesterRefusal
      - Other
    CreateExceptionRequest:
      type: object
      required:
      - category
      properties:
        category:
          $ref: '#/components/schemas/ExceptionCategory'
        severity:
          allOf:
          - $ref: '#/components/schemas/Severity'
          default: Medium
        description:
          type: string
          maxLength: 2000
        evidenceIds:
          type: array
          items:
            type: string
            format: uuid
        reason:
          type: string
          enum:
          - RecipientNotAvailable
          - LocationLocked
          - PackageDamaged
          - WrongLocation
          - Other
          description: The reason picked on the Report exception screen. `category` stays broad (FailedDelivery,
            Damaged); this is the detail.
      additionalProperties: false
    ExceptionCase:
      type: object
      properties:
        exceptionId:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/ExceptionCategory'
        severity:
          $ref: '#/components/schemas/Severity'
        status:
          type: string
          enum:
          - Open
          - InProgress
          - Resolved
        owner:
          $ref: '#/components/schemas/PersonRef'
        openedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolutionCode:
          type: string
          nullable: true
        description:
          type: string
          maxLength: 2000
        resolutionNote:
          type: string
          nullable: true
        escalationLevel:
          type: integer
          minimum: 0
        reason:
          type: string
          enum:
          - RecipientNotAvailable
          - LocationLocked
          - PackageDamaged
          - WrongLocation
          - Other
          description: The reason picked on the Report exception screen. `category` stays broad (FailedDelivery,
            Damaged); this is the detail.
        disputeReason:
          $ref: '#/components/schemas/DisputeReason'
      required:
      - exceptionId
      - packageId
      - category
      - severity
      - status
      - openedAt
    Notification:
      type: object
      properties:
        notificationId:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - Received
          - Delivered
          - AcknowledgementReminder
          - AssignmentTimeout
          - Escalation
          - ExceptionOpened
          - ContactMessage
        channel:
          type: string
          enum:
          - Email
          - Teams
          - Push
          - InApp
        recipient:
          $ref: '#/components/schemas/PersonRef'
        status:
          type: string
          enum:
          - Pending
          - Sent
          - Failed
          - Retrying
        attemptCount:
          type: integer
        message:
          type: string
          description: Display text. Never includes restricted-item details.
        sentAt:
          type: string
          format: date-time
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        eventGroupId:
          type: string
          format: uuid
          description: Notifications sent for one trigger (Email, Teams, and In-app for the same delivery) share
            this ID, so the status screen can show them as one.
        attempts:
          type: array
          description: Retry history, oldest first. Shown as Sent, Failed, Retried, Read.
          items:
            type: object
            required:
            - attemptedAt
            - status
            properties:
              attemptedAt:
                type: string
                format: date-time
              status:
                type: string
                enum:
                - Sent
                - Failed
                - Retried
              error:
                type: string
                nullable: true
                example: Teams timeout
      required:
      - notificationId
      - packageId
      - eventType
      - channel
      - status
      - attemptCount
    HistoryEvent:
      type: object
      required:
      - eventId
      - kind
      - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - Status
          - Custody
          - Evidence
          - Notification
          - Acknowledgement
          - Exception
          - Correction
        fromState:
          $ref: '#/components/schemas/PackageState'
        toState:
          $ref: '#/components/schemas/PackageState'
        reasonCode:
          type: string
        actor:
          $ref: '#/components/schemas/PersonRef'
        actorRole:
          $ref: '#/components/schemas/Role'
        occurredAt:
          type: string
          format: date-time
        source:
          type: string
          enum:
          - Mobile
          - Workflow
          - Integration
          - System
        notes:
          type: string
        correctsEventId:
          type: string
          format: uuid
          nullable: true
          description: Set on Correction events. Points to the record being corrected.
    QueueSummary:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        received:
          $ref: '#/components/schemas/QueueCount'
        delivered:
          $ref: '#/components/schemas/QueueCount'
        awaitingAcknowledgement:
          $ref: '#/components/schemas/QueueCount'
        openExceptions:
          type: integer
        byBuilding:
          type: array
          items:
            type: object
            properties:
              buildingCode:
                type: string
              received:
                type: integer
              inDelivery:
                type: integer
              delivered:
                type: integer
              unassigned:
                type: integer
                description: '"3 packages ready to hand off".'
        oldestExceptionAgeMinutes:
          type: integer
          nullable: true
          description: Age of the oldest open exception. "2 need action, oldest 3h".
      required:
      - generatedAt
      - received
      - delivered
      - awaitingAcknowledgement
      - openExceptions
    QueueCount:
      type: object
      properties:
        count:
          type: integer
        oldestAgeMinutes:
          type: integer
        agingOverThreshold:
          type: integer
        unassigned:
          type: integer
          description: Received queue only. "12 packages, 4 unassigned".
        completedToday:
          type: integer
          description: Delivered queue only. "18 completed".
        pendingAcknowledgement:
          type: integer
          description: Delivered queue only. "1 pending ack".
      required:
      - count
    Metrics:
      type: object
      properties:
        lastRefreshedAt:
          type: string
          format: date-time
        isStale:
          type: boolean
        receiptToDeliveryMinutesMedian:
          type: number
        lookupTimeSecondsMedian:
          type: number
        evidenceCompletionRate:
          type: number
          minimum: 0
          maximum: 1
        acknowledgementRate:
          type: number
          minimum: 0
          maximum: 1
        notificationSuccessRate:
          type: number
          minimum: 0
          maximum: 1
        exceptionCount:
          type: integer
        exceptionMedianAgeHours:
          type: number
        receiptToDeliveryMinutesAverage:
          type: number
          description: Shown as "Average time to deliver". The median is still returned for the pilot report.
        acknowledgedOnTimeRate:
          type: number
          minimum: 0
          maximum: 1
          description: Share acknowledged before `ackDueAt`. Shown as "Acknowledged on time".
        agingOverThresholdCount:
          type: integer
          description: Packages older than the aging threshold. Shown as "Aging packages".
        agingThresholdHours:
          type: integer
        trend:
          type: array
          description: One point per day or week in the requested range, oldest first.
          items:
            type: object
            required:
            - periodStart
            properties:
              periodStart:
                type: string
                format: date-time
              deliveredCount:
                type: integer
              receiptToDeliveryMinutesAverage:
                type: number
              acknowledgedOnTimeRate:
                type: number
                minimum: 0
                maximum: 1
      required:
      - lastRefreshedAt
      - isStale
    SyncCommand:
      description: One queued action. The payload is the same body as the matching endpoint.
      oneOf:
      - $ref: '#/components/schemas/SyncReceivePackageCommand'
      - $ref: '#/components/schemas/SyncMatchPackageCommand'
      - $ref: '#/components/schemas/SyncAssignPackageCommand'
      - $ref: '#/components/schemas/SyncAcceptAssignmentCommand'
      - $ref: '#/components/schemas/SyncDeclineAssignmentCommand'
      - $ref: '#/components/schemas/SyncStartDeliveryCommand'
      - $ref: '#/components/schemas/SyncCreateEvidenceCommand'
      - $ref: '#/components/schemas/SyncCompleteEvidenceCommand'
      - $ref: '#/components/schemas/SyncDeleteEvidenceCommand'
      - $ref: '#/components/schemas/SyncDeliverPackageCommand'
      - $ref: '#/components/schemas/SyncReturnPackageCommand'
      - $ref: '#/components/schemas/SyncCreateExceptionCommand'
      - $ref: '#/components/schemas/SyncSubmitAcknowledgementCommand'
      discriminator:
        propertyName: type
        mapping:
          ReceivePackage: '#/components/schemas/SyncReceivePackageCommand'
          MatchPackage: '#/components/schemas/SyncMatchPackageCommand'
          AssignPackage: '#/components/schemas/SyncAssignPackageCommand'
          AcceptAssignment: '#/components/schemas/SyncAcceptAssignmentCommand'
          DeclineAssignment: '#/components/schemas/SyncDeclineAssignmentCommand'
          StartDelivery: '#/components/schemas/SyncStartDeliveryCommand'
          CreateEvidence: '#/components/schemas/SyncCreateEvidenceCommand'
          CompleteEvidence: '#/components/schemas/SyncCompleteEvidenceCommand'
          DeleteEvidence: '#/components/schemas/SyncDeleteEvidenceCommand'
          DeliverPackage: '#/components/schemas/SyncDeliverPackageCommand'
          ReturnPackage: '#/components/schemas/SyncReturnPackageCommand'
          CreateException: '#/components/schemas/SyncCreateExceptionCommand'
          SubmitAcknowledgement: '#/components/schemas/SyncSubmitAcknowledgementCommand'
    SyncResult:
      type: object
      required:
      - idempotencyKey
      - status
      properties:
        idempotencyKey:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - Applied
          - Duplicate
          - Conflict
          - Rejected
          - Skipped
          description: 'Applied: done. Duplicate: done earlier, same result. Conflict: state or ETag changed. Rejected:
            invalid or not allowed. Skipped: a command it depends on did not succeed.'
        skippedBecause:
          type: string
          format: uuid
          nullable: true
          description: The dependency that failed. Set when status is Skipped.
        problem:
          $ref: '#/components/schemas/Problem'
        package:
          $ref: '#/components/schemas/PackageSummary'
        etag:
          type: string
          nullable: true
          description: Package ETag after this command. Use it for the next batch.
        uploadSlot:
          allOf:
          - $ref: '#/components/schemas/EvidenceUploadSlot'
          description: Returned for CreateEvidence so the device can upload without another round trip.
    AuditEvent:
      type: object
      properties:
        auditId:
          type: string
          format: uuid
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        action:
          type: string
          example: EvidenceViewed
        actor:
          $ref: '#/components/schemas/PersonRef'
        actorRole:
          $ref: '#/components/schemas/Role'
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: true
        sensitivity:
          type: string
          enum:
          - Normal
          - Restricted
          - Audit
      required:
      - auditId
      - entityType
      - entityId
      - action
      - actor
      - occurredAt
      - correlationId
    EvidenceType:
      type: string
      enum:
      - ReceiptPhoto
      - DeliveryPhoto
      - InspectionPhoto
      - Signature
      - RequesterDisputePhoto
      description: Notes are not evidence blobs. Use `notes` on delivery, `comment` on acknowledgement, `description`
        on exceptions.
    Severity:
      type: string
      enum:
      - Low
      - Medium
      - High
    RestrictedCategory:
      type: string
      enum:
      - ControlledSubstance
      - HazardousMaterial
    EvidenceRemovalReason:
      type: string
      enum:
      - BlurryOrUnclear
      - WrongPackage
      - WrongAngleOrContent
      - SensitiveInfoVisible
      - Duplicate
      - Other
    RestrictedStatus:
      type: object
      x-needs-review: 'Placeholder. Open: which inspection and handoff details are kept, who can see them, and who writes the handling instructions.'
      description: What the Restricted package screen shows. Only present on a restricted package, and left out for Requesters. Policy is still being defined, so this is a placeholder like the inspection call.
      required:
      - inspectionStatus
      properties:
        inspectionStatus:
          type: string
          enum:
          - Required
          - Passed
          - Failed
          - Hold
          description: Required until an inspector records an outcome. After that it matches the last `outcome`.
        inspectedBy:
          $ref: '#/components/schemas/PersonRef'
        inspectedAt:
          type: string
          format: date-time
          description: Left out until an inspector records an outcome.
        handlingInstructions:
          type: string
          maxLength: 2000
          description: What the courier must follow when carrying it. Left out until there are instructions.
        handoffAuthorizedTo:
          $ref: '#/components/schemas/PersonRef'
        handoffAuthorizedAt:
          type: string
          format: date-time
          description: Handoff fields are left out until a handoff is authorized.
    RestrictedAuthorization:
      type: object
      required:
      - category
      - purpose
      x-needs-review: 'Open: who grants and revokes authorizations, and the expiry policy (validUntil).'
      description: A live authorization to inspect or carry one restricted category. Holding the inspector or
        delivery role alone is not enough.
      properties:
        category:
          $ref: '#/components/schemas/RestrictedCategory'
        purpose:
          type: string
          enum:
          - Inspect
          - Carry
          description: Inspect is for Restricted-Item Inspectors. Carry is for Delivery Team Members.
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: Null means no expiry (policy still open).
    CompleteEvidenceRequest:
      type: object
      required:
      - checksum
      additionalProperties: false
      properties:
        checksum:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 hex of the uploaded file.
    MatchPackageRequest:
      type: object
      required:
      - procurementOrderId
      additionalProperties: false
      properties:
        procurementOrderId:
          type: string
          maxLength: 64
        note:
          type: string
          maxLength: 1000
    DeclineAssignmentRequest:
      type: object
      required:
      - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
    StartDeliveryRequest:
      type: object
      additionalProperties: false
      properties:
        startedAt:
          type: string
          format: date-time
          description: Offline clients send the capture time. Defaults to server time.
    HoldRequest:
      type: object
      required:
      - reasonCode
      additionalProperties: false
      properties:
        reasonCode:
          type: string
          enum:
          - RestrictedHold
          - NeedsInspection
          - MissingLocation
          - AwaitingRequester
          - Other
        note:
          type: string
          maxLength: 1000
          description: Required when reasonCode is Other.
    ReleaseRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 1000
    ReturnRequest:
      type: object
      required:
      - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          enum:
          - CannotAccessLocation
          - RecipientUnavailable
          - WrongBuilding
          - DamagedOnRoute
          - Other
        note:
          type: string
          maxLength: 1000
          description: Required when reason is Other.
        returnedAt:
          type: string
          format: date-time
    CorrectionBase:
      type: object
      required:
      - field
      - reason
      properties:
        field:
          type: string
          enum:
          - deliveryLocation
          - deliveredAt
          - deliveryNotes
          - packageCount
          - assignee
          - other
        reason:
          type: string
          maxLength: 1000
        approvedBy:
          type: string
          format: uuid
          description: Required when policy needs a second person to approve, such as restricted-item records. Must
            be someone other than the caller.
    DeliveryLocationCorrection:
      allOf:
      - $ref: '#/components/schemas/CorrectionBase'
      - type: object
        required:
        - newLocationId
        properties:
          field:
            type: string
            enum:
            - deliveryLocation
          newLocationId:
            type: string
            format: uuid
    DeliveredAtCorrection:
      allOf:
      - $ref: '#/components/schemas/CorrectionBase'
      - type: object
        required:
        - newDeliveredAt
        properties:
          field:
            type: string
            enum:
            - deliveredAt
          newDeliveredAt:
            type: string
            format: date-time
    DeliveryNotesCorrection:
      allOf:
      - $ref: '#/components/schemas/CorrectionBase'
      - type: object
        required:
        - newNotes
        properties:
          field:
            type: string
            enum:
            - deliveryNotes
          newNotes:
            type: string
            maxLength: 2000
    PackageCountCorrection:
      allOf:
      - $ref: '#/components/schemas/CorrectionBase'
      - type: object
        required:
        - newPackageCount
        properties:
          field:
            type: string
            enum:
            - packageCount
          newPackageCount:
            type: integer
            minimum: 1
    AssigneeCorrection:
      allOf:
      - $ref: '#/components/schemas/CorrectionBase'
      - type: object
        required:
        - newAssigneeId
        properties:
          field:
            type: string
            enum:
            - assignee
          newAssigneeId:
            type: string
            format: uuid
          assignedToRole:
            type: string
            enum:
            - DeliveryTeamMember
    OtherCorrection:
      allOf:
      - $ref: '#/components/schemas/CorrectionBase'
      - type: object
        required:
        - targetEntity
        - targetId
        - fieldName
        - newValue
        properties:
          field:
            type: string
            enum:
            - other
          targetEntity:
            type: string
            enum:
            - package_record
            - assignment
            - evidence_item
            - exception_case
            - acknowledgement
          targetId:
            type: string
            format: uuid
          fieldName:
            type: string
            maxLength: 100
          newValue:
            type: string
            maxLength: 2000
    CorrectionRequest:
      description: One correction. The shape depends on `field`. The original value is kept; a correction event
        is added to history.
      oneOf:
      - $ref: '#/components/schemas/DeliveryLocationCorrection'
      - $ref: '#/components/schemas/DeliveredAtCorrection'
      - $ref: '#/components/schemas/DeliveryNotesCorrection'
      - $ref: '#/components/schemas/PackageCountCorrection'
      - $ref: '#/components/schemas/AssigneeCorrection'
      - $ref: '#/components/schemas/OtherCorrection'
      discriminator:
        propertyName: field
        mapping:
          deliveryLocation: '#/components/schemas/DeliveryLocationCorrection'
          deliveredAt: '#/components/schemas/DeliveredAtCorrection'
          deliveryNotes: '#/components/schemas/DeliveryNotesCorrection'
          packageCount: '#/components/schemas/PackageCountCorrection'
          assignee: '#/components/schemas/AssigneeCorrection'
          other: '#/components/schemas/OtherCorrection'
    OrderSearchRequest:
      type: object
      additionalProperties: false
      description: At least one field is required.
      anyOf:
      - required:
        - orderId
      - required:
        - vendorId
      - required:
        - vendorName
      - required:
        - catalogueNumber
      - required:
        - requesterName
      - required:
        - barcode
      properties:
        orderId:
          type: string
          maxLength: 64
        vendorId:
          type: string
          maxLength: 64
        vendorName:
          type: string
          minLength: 2
          maxLength: 200
        catalogueNumber:
          type: string
          maxLength: 100
        requesterName:
          type: string
          minLength: 2
          maxLength: 200
        barcode:
          type: string
          maxLength: 200
          description: Optional. Barcode scanning is not required for launch.
    AcceptAssignmentRequest:
      type: object
      additionalProperties: false
      properties:
        handlingAcknowledged:
          type: boolean
          description: Required to be true when the package is restricted. The courier has read the handling instructions.
    AcceptAssignmentPayload:
      type: object
      required:
      - assignmentId
      additionalProperties: false
      properties:
        assignmentId:
          type: string
          format: uuid
        handlingAcknowledged:
          type: boolean
          description: Same as the normal accept call. Required to be true for a restricted package.
    DeclineAssignmentPayload:
      type: object
      required:
      - assignmentId
      - reason
      additionalProperties: false
      properties:
        assignmentId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
    CompleteEvidencePayload:
      type: object
      required:
      - evidenceId
      - checksum
      additionalProperties: false
      properties:
        evidenceId:
          type: string
          format: uuid
        checksum:
          type: string
          pattern: ^[0-9a-f]{64}$
    DeleteEvidencePayload:
      type: object
      required:
      - evidenceId
      - reason
      additionalProperties: false
      properties:
        evidenceId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/EvidenceRemovalReason'
        note:
          type: string
          maxLength: 500
    SyncCommandBase:
      type: object
      required:
      - idempotencyKey
      - type
      - queuedAt
      properties:
        idempotencyKey:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - ReceivePackage
          - MatchPackage
          - AssignPackage
          - AcceptAssignment
          - DeclineAssignment
          - StartDelivery
          - CreateEvidence
          - CompleteEvidence
          - DeleteEvidence
          - DeliverPackage
          - ReturnPackage
          - CreateException
          - SubmitAcknowledgement
        packageId:
          type: string
          format: uuid
          nullable: true
          description: The package this command acts on. For ReceivePackage it is optional and `payload.packageId`
            is used.
        ifMatch:
          type: string
          nullable: true
          description: Package ETag the device last saw. Only checked for the FIRST command on a package in a batch.
            Later commands on the same package are chained by the server against the version the earlier command
            produced.
          maxLength: 128
        queuedAt:
          type: string
          format: date-time
        dependsOn:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
          description: Idempotency keys of commands that must be Applied or Duplicate first. If one fails, this
            command is Skipped.
    SyncReceivePackageCommand:
      allOf:
      - $ref: '#/components/schemas/SyncCommandBase'
      - type: object
        required:
        - payload
        properties:
          type:
            type: string
            enum:
            - ReceivePackage
          payload:
            $ref: '#/components/schemas/ReceivePackageRequest'
    SyncMatchPackageCommand:
      allOf:
      - $ref: '#/components/schemas/SyncCommandBase'
      - type: object
        required:
        - payload
        - packageId
        properties:
          type:
            type: string
            enum:
            - MatchPackage
          payload:
            $ref: '#/components/schemas/MatchPackageRequest'
    SyncAssignPackageCommand:
      allOf:
      - $ref: '#/components/schemas/SyncCommandBase'
      - type: object
        required:
        - payload
        - packageId
        properties:
          type:
            type: string
            enum:
            - AssignPackage
          payload:
            $ref: '#/components/schemas/AssignRequest'
    SyncAcceptAssignmentCommand:
      allOf:
      - $ref: '#/components/schemas/SyncCommandBase'
      - type: object
        required:
        - payload
        - packageId
        properties:
          type:
            type: string
            enum:
            - AcceptAssignment
          payload:
            $ref: '#/components/schemas/AcceptAssignmentPayload'
    SyncDeclineAssignmentCommand:
      allOf:
      - $ref: '#/components/schemas/SyncCommandBase'
      - type: object
        required:
        - payload
        - packageId
        properties:
          type:
            type: string
            enum:
            - DeclineAssignment
          payload:
            $ref: '#/components/schemas/DeclineAssignmentPayload'
    SyncStartDeliveryCommand:
      allOf:
      - $ref: '#/components/schemas/SyncCommandBase'
      - type: object
        required:
        - payload
        - packageId
        properties:
          type:
            type: string
            enum:
            - StartDelivery
          payload:
            $ref: '#/components/schemas/StartDeliveryRequest'
    SyncCreateEvidenceCommand:
      allOf:
      - $ref: '#/components/schemas/SyncCommandBase'
      - type: object
        required:
        - payload
        - packageId
        properties:
          type:
            type: string
            enum:
            - CreateEvidence
          payload:
            $ref: '#/components/schemas/CreateEvidenceRequest'
    SyncCompleteEvidenceCommand:
      allOf:
      - $ref: '#/components/schemas/SyncCommandBase'
      - type: object
        required:
        - payload
        - packageId
        properties:
          type:
            type: string
            enum:
            - CompleteEvidence
          payload:
            $ref: '#/components/schemas/CompleteEvidencePayload'
    SyncDeleteEvidenceCommand:
      allOf:
      - $ref: '#/components/schemas/SyncCommandBase'
      - type: object
        required:
        - payload
        - packageId
        properties:
          type:
            type: string
            enum:
            - DeleteEvidence
          payload:
            $ref: '#/components/schemas/DeleteEvidencePayload'
    SyncDeliverPackageCommand:
      allOf:
      - $ref: '#/components/schemas/SyncCommandBase'
      - type: object
        required:
        - payload
        - packageId
        properties:
          type:
            type: string
            enum:
            - DeliverPackage
          payload:
            $ref: '#/components/schemas/DeliverRequest'
    SyncReturnPackageCommand:
      allOf:
      - $ref: '#/components/schemas/SyncCommandBase'
      - type: object
        required:
        - payload
        - packageId
        properties:
          type:
            type: string
            enum:
            - ReturnPackage
          payload:
            $ref: '#/components/schemas/ReturnRequest'
    SyncCreateExceptionCommand:
      allOf:
      - $ref: '#/components/schemas/SyncCommandBase'
      - type: object
        required:
        - payload
        - packageId
        properties:
          type:
            type: string
            enum:
            - CreateException
          payload:
            $ref: '#/components/schemas/CreateExceptionRequest'
    SyncSubmitAcknowledgementCommand:
      allOf:
      - $ref: '#/components/schemas/SyncCommandBase'
      - type: object
        required:
        - payload
        - packageId
        properties:
          type:
            type: string
            enum:
            - SubmitAcknowledgement
          payload:
            $ref: '#/components/schemas/AcknowledgementRequest'
    SyncRequest:
      type: object
      required:
      - deviceId
      - commands
      additionalProperties: false
      properties:
        deviceId:
          type: string
          maxLength: 128
        commands:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/SyncCommand'
    SyncResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncResult'
    OrderMatch:
      type: object
      required:
      - order
      - matchScore
      properties:
        order:
          $ref: '#/components/schemas/OrderRef'
        matchScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Shown as "96% match" on the order lookup screen.
        matchedOn:
          type: array
          items:
            type: string
            enum:
            - OrderId
            - Vendor
            - CatalogueNumber
            - Requester
            - Barcode
    ContactInfo:
      type: object
      required:
      - displayName
      - channels
      description: How to reach someone. PackageFlow sends Teams and email messages itself, so no address is returned
        for them. The phone number is returned only so the app can open the dialer.
      properties:
        displayName:
          type: string
        channels:
          type: array
          description: What can be used right now. A channel is left out when the person has it turned off or has no
            address for it. The contact sheet greys out the rest.
          items:
            type: string
            enum:
            - Teams
            - Email
            - Phone
        phone:
          type: string
          nullable: true
          description: Set only when `channels` includes Phone.
    PackageContacts:
      type: object
      required:
      - facilities
      properties:
        requester:
          allOf:
          - $ref: '#/components/schemas/ContactInfo'
          description: Staff only. Omitted when the caller is the requester.
        currentOwner:
          allOf:
          - $ref: '#/components/schemas/ContactInfo'
        facilities:
          $ref: '#/components/schemas/ContactInfo'
    LogContactAttemptRequest:
      type: object
      required:
      - target
      - channel
      additionalProperties: false
      properties:
        target:
          type: string
          enum:
          - Requester
          - FacilitiesLead
          - CurrentOwner
          - Facilities
        channel:
          type: string
          enum:
          - Phone
          description: Phone only. PackageFlow records Teams and email itself when it sends.
        note:
          type: string
          maxLength: 500
    SendContactMessageRequest:
      type: object
      required:
      - target
      - channel
      - purpose
      additionalProperties: false
      properties:
        target:
          type: string
          enum:
          - Requester
          - FacilitiesLead
          - CurrentOwner
          - Facilities
        channel:
          type: string
          enum:
          - Teams
          - Email
        purpose:
          type: string
          enum:
          - MissingLocation
          - ExceptionFollowUp
          - PackageQuestion
          description: Picks the wording. The server writes the text. Never includes restricted-item details.
        note:
          type: string
          maxLength: 500
          description: Optional text added to the message.
    ContactAttempt:
      type: object
      required:
      - contactAttemptId
      - target
      - channel
      - attemptedAt
      properties:
        contactAttemptId:
          type: string
          format: uuid
        target:
          type: string
        channel:
          type: string
        attemptedBy:
          $ref: '#/components/schemas/PersonRef'
        attemptedAt:
          type: string
          format: date-time
        notificationId:
          type: string
          format: uuid
          description: Set when PackageFlow sent a message. Use it to find delivery status and retries. Not set for a logged call.
    DeliveryLocationRequest:
      type: object
      required:
      - locationId
      - reason
      additionalProperties: false
      properties:
        locationId:
          type: string
          format: uuid
          description: From `GET /locations`.
        reason:
          type: string
          enum:
          - OrderMissingLocation
          - RequesterConfirmed
          - LocationChanged
          - Other
        note:
          type: string
          maxLength: 500
    RequestReassignmentRequest:
      type: object
      required:
      - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          enum:
          - TooManyPackages
          - WrongBuilding
          - Unavailable
          - Other
        note:
          type: string
          maxLength: 500
    BatchAssignRequest:
      type: object
      required:
      - assignedTo
      - items
      additionalProperties: false
      properties:
        assignedTo:
          type: string
          format: uuid
        assignedToRole:
          type: string
          enum:
          - DeliveryTeamMember
        reason:
          type: string
          maxLength: 500
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required:
            - packageId
            - ifMatch
            additionalProperties: false
            properties:
              packageId:
                type: string
                format: uuid
              ifMatch:
                type: string
                maxLength: 128
    BatchAssignResult:
      type: object
      required:
      - packageId
      - status
      properties:
        packageId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - Applied
          - Duplicate
          - Conflict
          - Rejected
        etag:
          type: string
          nullable: true
        assignment:
          allOf:
          - $ref: '#/components/schemas/Assignment'
        problem:
          $ref: '#/components/schemas/Problem'
    BatchAssignResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchAssignResult'
    HandoffAuthorizationRequest:
      type: object
      required:
      - toPerson
      additionalProperties: false
      properties:
        toPerson:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 500
        approvedBy:
          type: string
          format: uuid
          description: Second approver, if policy requires one.
    ReminderRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 500
    MetricsReportRequest:
      type: object
      required:
      - from
      - to
      additionalProperties: false
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        building:
          type: string
          maxLength: 32
        format:
          type: string
          enum:
          - Pdf
          - Csv
          default: Pdf
    DeliverySummary:
      type: object
      required:
      - assignedCount
      - buildingCount
      - deliveredToday
      description: The three cards on My deliveries, plus the count in the welcome line.
      properties:
        assignedCount:
          type: integer
          description: '"6 packages"'
        buildingCount:
          type: integer
          description: '"2 buildings"'
        pendingAcceptance:
          type: integer
        deliveredToday:
          type: integer
          description: '"9 completed"'
        awaitingAcknowledgement:
          type: integer
          description: '"1 awaiting"'
        needsLocation:
          type: integer
    RequesterSummary:
      type: object
      required:
      - onTheWay
      - readyToConfirm
      - openReports
      description: Counts for the requester Home and My packages screens.
      properties:
        onTheWay:
          type: integer
          description: '"3 in transit"'
        nextBuildingCode:
          type: string
          nullable: true
          description: '"next: Building A"'
        readyToConfirm:
          type: integer
          description: '"1 delivered"'
        readyToConfirmLocation:
          allOf:
          - $ref: '#/components/schemas/Location'
        openReports:
          type: integer
          description: '"1 report in progress" / "1 under review"'
        delivered:
          type: integer
    NotificationChannels:
      type: object
      additionalProperties: false
      properties:
        email:
          type: boolean
        teams:
          type: boolean
        push:
          type: boolean
    Preferences:
      type: object
      required:
      - notificationChannels
      properties:
        notificationChannels:
          $ref: '#/components/schemas/NotificationChannels'
        lockedChannels:
          type: array
          readOnly: true
          items:
            type: string
            enum:
            - email
            - teams
            - push
          description: Channels policy will not let this person turn off.
        defaultBuildingCode:
          type: string
          nullable: true
          description: Staff only. The default building on Settings.
    PreferencesUpdate:
      type: object
      additionalProperties: false
      properties:
        notificationChannels:
          $ref: '#/components/schemas/NotificationChannels'
        defaultBuildingCode:
          type: string
          nullable: true
          maxLength: 32
