      x-screens:
      - 'Delivery: Photo evidence, Package delivered (View submitted proof)'
    post:
      tags:
      - Photos & Evidence
      summary: Create an evidence upload (step 1 of 2)
      description: |
        **Who can use this:** Package Receiver, Delivery Team Member, Restricted-Item Inspector, Requester.

        Creates an evidence record in `Pending` and returns a short-lived upload URL for Azure Blob Storage.
        The app uploads the file directly to that URL, then calls the complete endpoint.
        Binary files never pass through this API. Send your own `evidenceId` if the app is offline and needs to refer to the photo later.

        Who can upload what:
        - Package Receiver: `ReceiptPhoto` after the package record exists
        - Delivery Team Member: `DeliveryPhoto`, `Signature`
        - Authorized Restricted-Item Inspector: `InspectionPhoto` only
        - Requester: `RequesterDisputePhoto`, only on their own package after delivery

        Text notes are not evidence. Put them in `notes` on delivery, `comment` on acknowledgement, or `description` on an exception.

        A package can have at most 3 active `DeliveryPhoto` items. A fourth returns 422.
      operationId: createEvidenceUpload
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvidenceRequest'
      responses:
        '201':
          description: Upload slot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceUploadSlot'
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Package-ETag:
              $ref: '#/components/headers/PackageETag'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
