  /packages/{packageId}/deliver:
    parameters:
    - $ref: '#/components/parameters/PackageId'
    post:
      tags:
      - Delivery Team
      summary: Mark a package as Delivered
      description: |
        **Who can use this:** Delivery Team Member.

        For a restricted package, `403` `/problems/not-authorized-for-category` if the courier's authorization for the category has lapsed.
        Runs the evidence gate. Fails with `422` if required evidence is not `Uploaded` and `Active`, or the delivery location is missing, unless an authorized exception override is supplied.
        Send `locationId` from `GET /locations`. The server stores a snapshot of the building and room text at delivery time, so later renames do not change the record.
        On success the package moves to `AwaitingAcknowledgement`, the evidence it references is marked submitted, and the requester is notified.
        Once every package on the order is delivered, a background job marks the order delivered in procurement.
        A procurement failure never blocks or reverses delivery. It shows in `procurementSync` and can be retried.
      operationId: deliverPackage
      x-required-roles:
      - DeliveryTeamMember
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverRequest'
      responses:
        '200':
          description: Delivered
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
